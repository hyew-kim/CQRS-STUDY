version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
#      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/data:/docker-entrypoint-initdb.d
    networks:
      - postgres_network
    command: [ "postgres", "-c", "log_statement=all" ]  # SQL 로깅 활성화

volumes:
  postgres_data:

networks:
  postgres_network:
    driver: bridge